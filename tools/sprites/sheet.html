<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>山海拾遗 · 精灵绘图纸（batch 1 + 2）</title>
<!--
  ===========================================================================
  用法（不要另找方法，这条流水线是验证过的）
  ===========================================================================
  1) 改下面的 SPRITES 数组（增删槽位、改画法），存盘。
  2) 跑一键脚本（它会按槽位数自动算网格尺寸并开 Edge 无头截图）：

     & .\tools\sprites\build.ps1

     等价的手工命令（--window-size 必须 = COLS*CELL × ROWS*CELL，
     当前 12 个槽位 = 3 列 × 4 行 = 768×1024）：

     & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" `
       --headless=new --disable-gpu --no-sandbox --hide-scrollbars `
       --default-background-color=00000000 `
       --window-size=768,1024 `
       --screenshot="D:\吴琦姜也\shanhai\tools\sprites\_sheet.png" `
       "file:///D:/吴琦姜也/shanhai/tools/sprites/sheet.html"

     （stderr 里的 ERROR:QQBrowser / task_manager 噪音是正常的，看有没有产出 PNG。）

  3) python slice.py  —— 按单元格切片、缩放到 manifest 里的确切尺寸、
     写进 assets/sprites/，并跑全部自检 + 生成联络表。

  ===========================================================================
  坐标约定（照着画就不会被游戏裁掉、不会偏心）
  ===========================================================================
  · 每个单元格 CELL×CELL（默认 256），画布 3 列 × N 行（N = ceil(槽位数 / 3)）。
  · 单元格内部再划分出一个居中的 ART×ART（默认 200）正方形，坐标原点
    平移到这个正方形的中心。所有绘制函数都在 [-100, +100] 的坐标系里画，
    正右 +x、正下 +y（顶视角：屏幕上方 = 生物的前方）。
  · 所以「居中」是构造出来的，不需要靠肉眼对齐：只要不画出 ±100，
    就永远有留白、永远不会贴边、也不会被后续缩放拉伸（ART 是正方形）。
  · 绘制是 4 倍超采样（32×32 的精灵在 200×200 里画，再 Lanczos 缩到 32×32），
    所以是带抗锯齿的矢量绘制，不是点阵像素画。
  · 颜色只能取自 src/content/series.js 的 color/accent 与
    src/content/enemies.js 的既有配色，不要自己发明主色。
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  canvas { display: block; image-rendering: auto; }
</style>
</head>
<body>
<canvas id="sheet"></canvas>
<script>
'use strict';

// ---------------------------------------------------------------------------
// 色板：直接抄 src/content/series.js（shan/hai/huang 的 color/accent）
// ---------------------------------------------------------------------------
const SERIES_INK = {
  shan:  { main: '#c9553d', accent: '#f0b357' },
  hai:   { main: '#2f7fb8', accent: '#7fd6ee' },
  huang: { main: '#6f5aa8', accent: '#c39bf0' },
  // 批 2 的三个角色（第 4~6 系），同样直接抄 src/content/series.js，不自己发明颜色
  tian:  { main: '#d9a02b', accent: '#ffe08a' },   // 天问 · 爆发暴击
  ling:  { main: '#2f9e8f', accent: '#8ff0dd' },   // 灵山 · 诅咒减益
  kun:   { main: '#8a93a8', accent: '#dfe6f2' },   // 昆仑 · 守护回复
};
// 中性色：暗色底 + 金色/玉色描边（上古神话审美），敌方偏冷暗
const INK = {
  outline:  '#140f16',   // 所有生物的描边
  rim:      '#f0b357',   // 金色描边（正面轮廓高光）
  jade:     '#8ff0dd',   // 玉色
  bone:     '#e8e2d0',   // 骨白
  boneDim:  '#9a9182',
  dark:     '#1a1015',   // 眼窝
  blood:    '#c0392b',
  ember:    '#ff8a4a',
  flame:    '#ffd166',
  flesh:    '#d9a86c',   // 兽面/虎皮
  fleshDim: '#a9764a',
  scaleHi:  '#cfd8ef',   // 蛇鳞冷高光
  shadow:   'rgba(0,0,0,0.45)',
};

// ---------------------------------------------------------------------------
// 几何 / 绘制小工具
// ---------------------------------------------------------------------------
function hexRGB(hex) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgba(hex, a) { const c = hexRGB(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function mix(a, b, t) {
  const A = hexRGB(a), B = hexRGB(b);
  return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`;
}

function poly(ctx, pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}
// 以 t 为参数在 [0,1] 上取样条点（Catmull-Rom 近似，够用且稳）
function pathThrough(ctx, pts, samples = 28) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let s = 1; s <= samples / (pts.length - 1); s++) {
      const t = s / (samples / (pts.length - 1));
      const t2 = t * t, t3 = t2 * t;
      const x = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
      const y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
      ctx.lineTo(x, y);
    }
  }
}
// 描边填充：正文 + 统一深色描边（上古壁画感）
function ink(ctx, fill, stroke = INK.outline, lw = 4) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke && lw > 0) {
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke();
  }
}
function disc(ctx, x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ink(ctx, fill, stroke, lw);
}
function capsule(ctx, x1, y1, x2, y2, w, fill, stroke, lw) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = w + (lw || 0) * 2; ctx.stroke(); }
  ctx.strokeStyle = fill; ctx.lineWidth = w; ctx.stroke();
}
// 眼：暗窝 + 亮瞳（朝向指示，永远朝屏幕上方 = 前）
function eye(ctx, x, y, r, pupil = '#ffe08a', glow = null) {
  disc(ctx, x, y, r, INK.dark, INK.outline, 1.6);
  if (glow) { disc(ctx, x, y, r * 0.72, glow, null, 0); }
  disc(ctx, x, y, r * 0.42, pupil, null, 0);
  disc(ctx, x - r * 0.18, y - r * 0.2, r * 0.16, '#ffffff', null, 0);
}
// 局部坐标系里画一个"部件"（头/手/翼），绕自身中心旋转
function part(ctx, x, y, rot, scale, fn) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.rotate(rot);
  fn(ctx, scale);
  ctx.restore();
}
// 软阴影（贴在身体下方，给一点体积而不是浮空）
function groundShadow(ctx, r, squash = 0.62, a = 0.4) {
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, r * 0.55, r * 0.92, r * 0.92 * squash, 0, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(6,5,10,${a})`; ctx.fill();
  ctx.restore();
}
// 放射渐变光晕（火鸟、自爆鬼、Boss）
function glow(ctx, x, y, r, color, a0 = 0.55) {
  const g = ctx.createRadialGradient(x, y, r * 0.05, x, y, r);
  g.addColorStop(0, rgba(color, a0));
  g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

// ---------------------------------------------------------------------------
// 三个玩家角色：同一「素体幼体」设定，靠器官轮廓区分三系
// ---------------------------------------------------------------------------
function baseLarva(ctx, main, accent, coreFill, coreR) {
  // 无定形幼体：一团柔软的原生质，边缘起伏（贝塞尔）
  const N = 13;
  const pts = [];
  for (let i = 0; i < N; i++) {
    const a = -Math.PI / 2 + (i / N) * Math.PI * 2;
    const wob = 1 + 0.13 * Math.sin(i * 2.3 + 0.7) + 0.07 * Math.cos(i * 3.7);
    pts.push([Math.cos(a) * 62 * wob, Math.sin(a) * 58 * wob]);
  }
  ctx.beginPath();
  ctx.moveTo((pts[0][0] + pts[N - 1][0]) / 2, (pts[0][1] + pts[N - 1][1]) / 2);
  for (let i = 0; i < N; i++) {
    const p = pts[i], q = pts[(i + 1) % N];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  ctx.closePath();
  const g = ctx.createRadialGradient(-18, -22, 6, 0, 0, 74);
  g.addColorStop(0, mix(main, '#ffffff', 0.34));
  g.addColorStop(0.55, main);
  g.addColorStop(1, mix(main, '#000000', 0.45));
  ink(ctx, g, INK.outline, 4.5);
  // 玉色内缘
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, 0, 60, 56, 0, 0, Math.PI * 2);
  ctx.clip();
  ctx.beginPath();
  ctx.ellipse(0, 1, 56, 52, 0, 0, Math.PI * 2);
  ctx.strokeStyle = rgba(accent, 0.5); ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();
  // 核心（每系不同器官的"根"）
  if (coreR > 0) {
    const gc = ctx.createRadialGradient(0, -coreR * 0.3, coreR * 0.15, 0, 0, coreR);
    gc.addColorStop(0, mix(coreFill, '#ffffff', 0.5));
    gc.addColorStop(1, coreFill);
    disc(ctx, 0, 0, coreR, gc, rgba(accent, 0.85), 2.5);
  }
}

function drawShanpo(ctx) {
  const S = SERIES_INK.shan;
  groundShadow(ctx, 64, 0.6, 0.4);
  // 山经器官：背甲（岩石板）——三块层叠的岩片，只露出中轴
  baseLarva(ctx, S.main, S.accent, mix(S.main, '#3a1a14', 0.5), 18);
  const plate = (w, h, y, t) => {
    const g = ctx.createLinearGradient(0, y - h, 0, y + h);
    g.addColorStop(0, mix(S.main, '#ffffff', 0.42));
    g.addColorStop(0.5, mix(S.main, '#000000', 0.05));
    g.addColorStop(1, mix(S.main, '#000000', 0.5));
    poly(ctx, [[-w, y + h * 0.55], [0, y - h * 0.7], [w, y + h * 0.55], [w * 0.86, y + h], [0, y + h * 0.86], [-w * 0.86, y + h]]);
    ink(ctx, g, INK.outline, 3.5);
    // 岩纹
    ctx.strokeStyle = rgba(S.accent, 0.4 + t * 0.25); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-w * 0.5, y + h * 0.25); ctx.lineTo(0, y - h * 0.35); ctx.lineTo(w * 0.5, y + h * 0.25); ctx.stroke();
  };
  plate(40, 20, 30, 0.0);
  plate(47, 24, 6, 0.4);
  plate(52, 26, -20, 0.7);
  // 双岩角
  part(ctx, -30, -52, -0.42, 1, (c) => {
    poly(ctx, [[-7, 10], [0, -20], [8, 9], [1, 14]]);
    ink(c, mix(S.accent, '#ffffff', 0.15), INK.outline, 3);
  });
  part(ctx, 30, -52, 0.42, 1, (c) => {
    poly(ctx, [[-7, 10], [0, -20], [8, 9], [1, 14]]);
    ink(c, mix(S.accent, '#ffffff', 0.15), INK.outline, 3);
  });
  // 前方（上方）的双目
  eye(ctx, -13, -34, 7.5, '#ffe9b0');
  eye(ctx, 13, -34, 7.5, '#ffe9b0');
  // 碎石粒（底层）
  for (const [x, y, r] of [[-46, 22, 5], [44, 30, 4.5], [-34, 44, 4], [38, -8, 4]]) {
    poly(ctx, [[x, y - r], [x + r, y], [x, y + r], [x - r, y]]);
    ink(ctx, mix(S.main, '#000000', 0.25), INK.outline, 2.5);
  }
}

function drawHaipo(ctx) {
  const S = SERIES_INK.hai;
  groundShadow(ctx, 62, 0.62, 0.38);
  // 海经器官：体侧四片鳍 + 两根垂须 + 水滴冠
  const fin = (x, y, rot, flip) => {
    part(ctx, x, y, rot, 1, (c) => {
      const g = c.createLinearGradient(0, -26, 0, 26);
      g.addColorStop(0, mix(S.accent, '#ffffff', 0.45));
      g.addColorStop(1, rgba(S.main, 0.98));
      c.beginPath();
      c.moveTo(0, -8);
      c.quadraticCurveTo(flip * 34, -30, flip * 48, -6);
      c.quadraticCurveTo(flip * 32, 4, 0, 10);
      c.closePath();
      ink(c, g, INK.outline, 3.5);
      c.strokeStyle = rgba(S.accent, 0.75); c.lineWidth = 1.6;
      for (let i = 1; i <= 3; i++) {
        c.beginPath(); c.moveTo(flip * 6, -4 + i * 3);
        c.quadraticCurveTo(flip * 24, -14 + i * 5, flip * 40, -6 + i * 2.4);
        c.stroke();
      }
    });
  };
  fin(-49, 6, -0.16, -1);
  fin(49, 6, 0.16, 1);
  fin(-42, 32, 0.5, -1);
  fin(42, 32, -0.5, 1);
  baseLarva(ctx, S.main, S.accent, mix(S.main, '#0d2740', 0.45), 17);
  // 内部水囊
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 6, 44, 36, 0, 0, Math.PI * 2); ctx.clip();
  const gw = ctx.createLinearGradient(0, -30, 0, 40);
  gw.addColorStop(0, rgba(S.accent, 0.55));
  gw.addColorStop(1, rgba(S.accent, 0));
  ctx.fillStyle = gw;
  ctx.beginPath(); ctx.ellipse(0, 2, 40, 32, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 两根垂须（前方）
  capsule(ctx, -10, -56, -26, -78, 5, mix(S.accent, '#ffffff', 0.2), INK.outline, 1.6);
  capsule(ctx, 10, -56, 26, -78, 5, mix(S.accent, '#ffffff', 0.2), INK.outline, 1.6);
  disc(ctx, -26, -79, 4, S.accent, INK.outline, 1.6);
  disc(ctx, 26, -79, 4, S.accent, INK.outline, 1.6);
  // 水滴冠（区别于山魄的岩角）
  poly(ctx, [[0, -74], [9, -60], [0, -50], [-9, -60]]);
  ink(ctx, mix(S.accent, '#ffffff', 0.35), INK.outline, 3);
  // 独眼（水滴状，横向）
  ctx.save();
  ctx.beginPath(); ctx.ellipse(1, -30, 13, 9.5, 0, 0, Math.PI * 2);
  ink(ctx, INK.dark, INK.outline, 3);
  disc(ctx, 1, -30, 6.4, S.accent, null, 0);
  disc(ctx, 1, -30, 3, '#0b2033', null, 0);
  disc(ctx, -1.4, -32, 1.7, '#ffffff', null, 0);
  ctx.restore();
}

function drawHuangpo(ctx) {
  const S = SERIES_INK.huang;
  groundShadow(ctx, 60, 0.6, 0.38);
  // 大荒经器官：周身八根荒刺 + 三道刻痕 + 悬浮碎屑
  const spikes = [[-0.62, 0.60], [-0.30, 0.85], [0.05, 0.92], [0.40, 0.80], [0.72, 0.52], [-0.86, 0.28], [0.94, 0.20], [0.30, -0.90], [-0.34, -0.88]];
  for (const [dx, dy] of spikes) {
    const a = Math.atan2(dy, dx);
    part(ctx, Math.cos(a) * 46, Math.sin(a) * 44, a + Math.PI / 2, 1, (c) => {
      poly(ctx, [[-6, 6], [0, -26], [6, 6]]);
      ink(c, mix(S.accent, '#000000', 0.15), INK.outline, 3);
    });
  }
  baseLarva(ctx, S.main, S.accent, mix(S.main, '#1a0f2b', 0.5), 15);
  // 刻痕三角（三只荒目）
  part(ctx, 0, -26, 0, 1, (c) => {
    poly(ctx, [[0, -18], [16, 12], [-16, 12]]);
    ink(c, mix(S.accent, '#ffffff', 0.1), INK.outline, 3.5);
    disc(c, 0, -1, 5.4, '#2a1240', null, 0);
    disc(c, 0, -1, 2.6, S.accent, null, 0);
  });
  for (const [x, y] of [[-30, 20], [30, 20]]) {
    ctx.save();
    ctx.beginPath(); ctx.moveTo(x, y - 12); ctx.lineTo(x + 11, y + 8); ctx.lineTo(x - 11, y + 8); ctx.closePath();
    ink(ctx, mix(S.main, '#000000', 0.35), rgba(S.accent, 0.9), 3);
    disc(ctx, x, y + 1, 3.2, S.accent, null, 0);
    ctx.restore();
  }
  // 悬浮碎屑
  for (const [x, y, r] of [[-62, -34, 6], [64, -26, 5], [-52, 44, 5.5], [58, 46, 6], [2, 66, 4.5]]) {
    poly(ctx, [[x, y - r], [x + r, y + r * 0.2], [x, y + r], [x - r, y + r * 0.2]]);
    ink(ctx, rgba(S.accent, 0.9), INK.outline, 2.5);
  }
}

// ---------------------------------------------------------------------------
// 五个普通敌人
// ---------------------------------------------------------------------------
function drawShanxiao(ctx) {
  const S = SERIES_INK.shan;
  groundShadow(ctx, 82, 0.55, 0.45);
  // 独脚（下方中轴，唯一支撑 → 最强的剪影特征）
  capsule(ctx, 2, 30, 8, 86, 15, mix(S.main, '#000000', 0.5), INK.outline, 2);
  part(ctx, 8, 92, 0, 1, (c) => {  // 脚爪（三趾）
    for (const a of [-0.5, 0, 0.5]) {
      part(c, 0, 0, a, 1, (cc) => { poly(cc, [[-4, 2], [0, 16], [5, 2]]); ink(cc, mix(S.accent, '#000000', 0.35), INK.outline, 2.5); });
    }
  });
  // 一双超出躯干的长臂 + 指爪
  const arm = (side) => {
    capsule(ctx, side * 20, -6, side * 62, 20, 13, mix(S.main, '#000000', 0.28), INK.outline, 2);
    capsule(ctx, side * 62, 20, side * 78, 50, 10, mix(S.main, '#000000', 0.2), INK.outline, 2);
    part(ctx, side * 80, 54, side * 0.35, 1, (c) => {
      for (const a of [-0.45, 0, 0.45]) {
        part(c, 0, 0, a, 1, (cc) => { poly(cc, [[-3, 0], [0, 15], [4, 0]]); ink(cc, INK.bone, INK.outline, 2.2); });
      }
    });
  };
  arm(-1); arm(1);
  // 肩部鬃毛（深色，压住手臂根部）
  for (const side of [-1, 1]) {
    for (let i = 0; i < 5; i++) {
      const a = side * (0.15 + i * 0.34) - Math.PI * (side > 0 ? 0.02 : 0.02);
      const r = 34;
      part(ctx, side * Math.cos(a) * 0 + Math.cos(a) * r, -4 + Math.sin(a) * r * 0.7, a + Math.PI / 2, 1, (c) => {
        poly(c, [[-6, 6], [0, -22], [6, 6]]);
        ink(c, mix(S.main, '#000000', 0.55), INK.outline, 2.2);
      });
    }
  }
  // 猿身（椭圆，深色毛发）
  ctx.beginPath(); ctx.ellipse(0, 6, 40, 34, 0, 0, Math.PI * 2);
  const gb = ctx.createRadialGradient(-14, -10, 6, 0, 6, 46);
  gb.addColorStop(0, mix(S.main, '#ffffff', 0.22));
  gb.addColorStop(1, mix(S.main, '#000000', 0.55));
  ink(ctx, gb, INK.outline, 5);
  // 毛发纹理
  ctx.strokeStyle = rgba('#000000', 0.35); ctx.lineWidth = 2.4;
  for (let i = 0; i < 7; i++) {
    const a = -0.4 + i * 0.55;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 20, 6 + Math.sin(a) * 18);
    ctx.lineTo(Math.cos(a) * 40, 6 + Math.sin(a) * 33);
    ctx.stroke();
  }
  // 人面（浅肉色面具，压在身体前缘）
  const faceG = ctx.createRadialGradient(0, -46, 4, 0, -36, 30);
  faceG.addColorStop(0, mix(INK.flesh, '#ffffff', 0.35));
  faceG.addColorStop(1, INK.fleshDim);
  poly(ctx, [[-21, -58], [-13, -68], [0, -72], [13, -68], [21, -58], [17, -34], [0, -27], [-17, -34]]);
  ink(ctx, faceG, INK.outline, 4);

function drawBifang(ctx) {

  const FLAME = '#ff8a3a', HOT = '#ffd98a';

  groundShadow(ctx, 74, 0.5, 0.32);
  // 尾焰（上方后方 → 屏幕上其实是后方 = 下方；顶视里"前"朝上，所以尾在后）
  const tail = (side) => {
    part(ctx, side * 8, 44, side * 0.34, 1, (c) => {
      const g = c.createLinearGradient(0, 0, side * 10, 62);
      g.addColorStop(0, rgba(HOT, 0.98));

      g.addColorStop(1, rgba(FLAME, 0));

      c.quadraticCurveTo(side * 20, 26, side * 26, 62);

      c.closePath();

      c.strokeStyle = rgba('#7a2f10', 0.8); c.lineWidth = 2.5; c.stroke();

  };
  tail(-1); tail(1);
  // 双翼（展开的火焰羽翼，带分羽）
  const wing = (side) => {
    part(ctx, side * 24, 2, side * 0.22, 1, (c) => {

      g.addColorStop(0, mix(FLAME, '#ffffff', 0.42));

      c.beginPath();
      c.moveTo(0, -14);
      c.quadraticCurveTo(side * 40, -34, side * 70, 2);
      c.quadraticCurveTo(side * 52, 14, side * 36, 20);
      c.quadraticCurveTo(side * 30, 34, side * 12, 30);
      c.closePath();
      ink(c, g, INK.outline, 4);

        c.quadraticCurveTo(side * 40, -14 + i * 9, side * 62 - i * 4, 2 + i * 6);
        c.stroke();
      }
    });
  };
  wing(-1); wing(1);
  // 一足（细长，中轴下方）
  capsule(ctx, 0, 34, -2, 74, 5, mix(S.main, '#000000', 0.1), INK.outline, 2);

  gb.addColorStop(0.6, FLAME);
  gb.addColorStop(1, mix(S.main, '#000000', 0.35));
  ink(ctx, gb, INK.outline, 4.5);
  // 长颈 + 头
  capsule(ctx, 0, -12, 0, -46, 12, mix(HOT, FLAME, 0.45), INK.outline, 2.4);
  ctx.beginPath(); ctx.ellipse(0, -56, 13, 15, 0, 0, Math.PI * 2);
  ink(ctx, mix(HOT, '#ffffff', 0.2), INK.outline, 4);

function drawHuashe(ctx) {

    pathThrough(ctx, pts);

  for (const p of spine) {

  wing(-1); wing(1);
  // 头（细长蛇首，压在颈前）

    c.quadraticCurveTo(9, 18, 0, 20);
    c.quadraticCurveTo(-9, 18, -12, 4);

    c.closePath();
    const g = c.createLinearGradient(0, -18, 0, 20);

    // 头冠双角

    }
    eye(c, -4.5, -4, 4, '#d6f7ff', S.accent);
    eye(c, 4.5, -4, 4, '#d6f7ff', S.accent);

}

  };
  arm(-1); arm(1);
  // 虎首（最大、最亮的部分 —— 一眼看出是"虎首人身"）
  const faceG = ctx.createRadialGradient(-8, -62, 4, 0, -50, 44);

  ink(ctx, faceG, INK.outline, 5);
  // 虎纹（额纹 + 颊纹）

  ctx.moveTo(0, -88); ctx.lineTo(0, -74);

  ctx.moveTo(9, -85); ctx.lineTo(13, -72);
  ctx.moveTo(-30, -62); ctx.lineTo(-19, -58);

      part(ctx, side * (32 + i * 2), -62 + i * 11, side * (0.9 + i * 0.25), 1, (c) => {

  eye(ctx, -13, -62, 7, '#ffd166', INK.ember);

  poly(ctx, [[-8, -50], [0, -44], [8, -50], [6, -42], [-6, -42]]);

function drawXiangliu(ctx) {
  const S = SERIES_INK.huang;
  // 底层盘绕的蛇身 + 毒瘴
  glow(ctx, 0, 4, 82, '#6b3fa0', 0.55);
  glow(ctx, 0, 4, 56, S.accent, 0.35);
  groundShadow(ctx, 82, 0.55, 0.45);

  // 盘绕的躯体：三条弧线
  const coil = (r, w, rot, col, a) => {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 6, r, r * 0.72, rot, 0.15, Math.PI * 1.75);
    ctx.lineCap = 'round';
    ctx.strokeStyle = rgba('#0d0714', a); ctx.lineWidth = w + 8; ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
    ctx.strokeStyle = rgba(S.accent, 0.35); ctx.lineWidth = Math.max(2, w * 0.22); ctx.stroke();
    ctx.restore();
  };
  coil(78, 24, 0.35, mix(S.main, '#000000', 0.25), 0.95);
  coil(60, 21, -0.9, mix(S.main, '#000000', 0.05), 0.98);
  coil(40, 17, 1.6, mix(S.accent, S.main, 0.5), 1);

  // 九个头：环形分布，颈从中心伸出
  // 半径必须让「头心 + 头半径 + 描边」留在 ±100 内，否则 PAD 一缩就会被裁。
  const HEAD_R = 68, NECK_W = 14, HEADS = 9;  const headsAt = [];
  for (let i = 0; i < HEADS; i++) {
    const a = -Math.PI / 2 + (i / HEADS) * Math.PI * 2;
    headsAt.push([a, Math.cos(a) * HEAD_R, Math.sin(a) * HEAD_R * 0.96]);
  }
  // 先画"后半圈"的颈与头
  const drawNeck = (a, hx, hy) => {
    const mx = Math.cos(a) * HEAD_R * 0.55 - Math.sin(a) * 16;
    const my = Math.sin(a) * HEAD_R * 0.5 + Math.cos(a) * 16;
    // 颈
    pathThrough(ctx, [[Math.cos(a) * 10, Math.sin(a) * 8], [mx, my], [hx * 0.86, hy * 0.86]], 24);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = INK.outline; ctx.lineWidth = NECK_W + 6; ctx.stroke();
    const gn = ctx.createLinearGradient(0, 0, hx, hy);
    gn.addColorStop(0, mix(S.main, '#000000', 0.35));
    gn.addColorStop(1, mix(S.main, '#ffffff', 0.12));
    ctx.strokeStyle = gn; ctx.lineWidth = NECK_W; ctx.stroke();
    // 颈鳞
    ctx.strokeStyle = rgba(S.accent, 0.45); ctx.lineWidth = 2.4;
    ctx.setLineDash([4, 6]);
    ctx.stroke();
    ctx.setLineDash([]);
  };
  const drawHead = (a, hx, hy, i) => {
    part(ctx, hx, hy, a + Math.PI / 2, 1, (c) => {
      // 蛇首：细长三角（整体尺寸收在 ±20 内，保证 9 个头的环形总幅不超界）
      c.beginPath();
      c.moveTo(0, -19);
      c.quadraticCurveTo(14, -12, 13.5, 5);
      c.quadraticCurveTo(11, 18, 0, 21);
      c.quadraticCurveTo(-11, 18, -13.5, 5);
      c.quadraticCurveTo(-14, -12, 0, -19);
      c.closePath();
      const g = c.createLinearGradient(0, -19, 0, 21);
      g.addColorStop(0, mix(S.accent, '#ffffff', 0.35));
      g.addColorStop(0.5, i % 2 ? mix(S.accent, S.main, 0.45) : mix(S.main, '#ffffff', 0.18));
      g.addColorStop(1, mix(S.main, '#000000', 0.45));
      ink(c, g, INK.outline, 4);
      // 双角
      for (const s2 of [-1, 1]) {
        part(c, s2 * 8, -14, s2 * 0.55, 1, (cc) => {
          poly(cc, [[-3, 4], [0, -13], [3.6, 4]]);
          ink(cc, mix(S.accent, '#ffffff', 0.1), INK.outline, 2.6);
        });
      }
      // 毒目（发光）
      glow(c, -4.5, -4, 10, S.accent, 0.75);
      glow(c, 4.5, -4, 10, S.accent, 0.75);
      eye(c, -4.5, -4, 4.2, '#fff0a8', S.accent);
      eye(c, 4.5, -4, 4.2, '#fff0a8', S.accent);
      // 信子
      c.strokeStyle = '#ff5f8a'; c.lineWidth = 2.4; c.lineCap = 'round';
      c.beginPath();
      c.moveTo(0, -19); c.lineTo(0, -28);
      c.moveTo(0, -28); c.lineTo(-5, -34); c.moveTo(0, -28); c.lineTo(5, -34);
      c.stroke();
    });
  };
  for (let i = 0; i < HEADS; i++) {
    const [a, hx, hy] = headsAt[i];
    if (Math.sin(a) < -0.15) drawNeck(a, hx, hy); // 后半球先画颈
  }
  // 中央躯干（九颈汇聚的肉团）
  ctx.beginPath(); ctx.ellipse(0, 2, 40, 36, 0, 0, Math.PI * 2);
  const gc = ctx.createRadialGradient(-12, -10, 6, 0, 2, 46);
  gc.addColorStop(0, mix(S.main, '#ffffff', 0.3));
  gc.addColorStop(0.6, mix(S.main, '#000000', 0.1));
  gc.addColorStop(1, mix(S.main, '#000000', 0.55));
  ink(ctx, gc, INK.outline, 6);
  // 躯干鳞甲（环形排布）
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    part(ctx, Math.cos(a) * 27, 2 + Math.sin(a) * 24, a + Math.PI / 2, 1, (c) => {
      poly(c, [[-7, 6], [0, -9], [7, 6]]);
      ink(c, rgba(S.accent, 0.75), INK.outline, 2.2);
    });
  }
  // 中心毒核
  glow(ctx, 0, 2, 30, S.accent, 0.8);
  disc(ctx, 0, 2, 13, mix(S.accent, '#ffffff', 0.3), rgba('#ffffff', 0.7), 3);
  disc(ctx, 0, 2, 6, '#ffffff', null, 0);
  // 前半球：颈 + 头
  for (let i = 0; i < HEADS; i++) {
    const [a, hx, hy] = headsAt[i];
    if (Math.sin(a) >= -0.15) drawNeck(a, hx, hy);
  }
  for (let i = 0; i < HEADS; i++) {
    const [a, hx, hy] = headsAt[i];
    drawHead(a, hx, hy, i);
  }
}

// ---------------------------------------------------------------------------
// 批 2 的三个玩家角色（第 4~6 系 · 天问/灵山/昆仑）
// 与批 1 的三个是同一个「素体幼体」设定：都用 baseLarva 画本体、同样的深色描边
// 与玉色内缘，只在「长出来的器官」上分系。三系的剪影必须互相不撞脸：
//   tian 天问 · 爆发暴击 → 瘦削棱形的躯体 + 放射金光刺 + 头顶竖立天眼与冠饰
//   ling 灵山 · 诅咒减益 → 傩面符纹 + 垂下的符纸幡 + 断续符环 + 漂浮咒粒
//   kun  昆仑 · 守护回复 → 玉璧盾环把圆钝的本体整圈包住 + 灵芝母题
// ---------------------------------------------------------------------------
function drawTianpo(ctx) {
  const S = SERIES_INK.tian;
  // 爆发光晕（暴击系）
  glow(ctx, 0, -8, 76, S.accent, 0.32);
  groundShadow(ctx, 50, 0.55, 0.34);
  // 放射状金色光刺：长短交错的尖针（"打得极疼"）
  // 描边故意不用近黑的 INK.outline，而用深金——否则在 32px 下会读成"虫腿"
  // 而不是"光刺"。
  const NEEDLES = 13;
  for (let i = 0; i < NEEDLES; i++) {
    const a = -Math.PI / 2 + (i / NEEDLES) * Math.PI * 2 + 0.16;
    const long = i % 2 === 0;
    const len = long ? 56 : 46;
    const w = long ? 5.2 : 3.8;
    part(ctx, Math.cos(a) * 38, Math.sin(a) * 36, a + Math.PI / 2, 1, (c) => {
      poly(c, [[-w, 9], [0, -len], [w, 9], [0, 3]]);
      const gn = c.createLinearGradient(0, -len, 0, 9);
      gn.addColorStop(0, mix(S.accent, '#ffffff', 0.55));
      gn.addColorStop(0.45, mix(S.accent, S.main, 0.25));
      gn.addColorStop(1, mix(S.main, '#000000', 0.25));
      ink(c, gn, mix(INK.outline, S.main, 0.3), 1.8);
    });
  }
  // 瘦削的躯体：仍是同一个素体幼体，横向收窄 → 尖长的棱形轮廓（"血却薄"）
  ctx.save();
  ctx.scale(0.74, 1.02);
  baseLarva(ctx, S.main, S.accent, 0, 0);
  ctx.restore();
  // 棱形金甲：一列窄锐角的护甲片（比山魄的宽岩板更窄、更有棱角）
  const plate = (y, w, h, hi) => {
    poly(ctx, [[0, y - h], [w, y], [0, y + h * 0.58], [-w, y]]);
    const g = ctx.createLinearGradient(0, y - h, 0, y + h);
    g.addColorStop(0, mix(S.accent, '#ffffff', 0.32));
    g.addColorStop(0.55, mix(S.main, '#ffffff', 0.06));
    g.addColorStop(1, mix(S.main, '#000000', 0.48));
    ink(ctx, g, INK.outline, 3);
    ctx.strokeStyle = rgba(S.accent, 0.55 + hi * 0.35);
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, y - h * 0.66); ctx.lineTo(0, y + h * 0.3); ctx.stroke();
  };
  plate(-4, 13, 16, 0);
  plate(20, 16, 18, 0.4);
  plate(42, 18, 20, 0.7);
  // 头顶天眼：竖立的锐利杏眼（朝屏幕上方 = 前），金瞳 + 竖缝
  ctx.save();
  glow(ctx, 0, -44, 22, S.accent, 0.5);
  ctx.beginPath();
  ctx.moveTo(0, -63);
  ctx.quadraticCurveTo(13, -44, 0, -25);
  ctx.quadraticCurveTo(-13, -44, 0, -63);
  ctx.closePath();
  ink(ctx, INK.dark, INK.outline, 3.2);
  ctx.beginPath(); ctx.ellipse(0, -44, 5.6, 13.4, 0, 0, Math.PI * 2);
  ink(ctx, mix(S.accent, '#ffffff', 0.28), null, 0);
  ctx.beginPath(); ctx.ellipse(0, -44, 1.8, 8.6, 0, 0, Math.PI * 2);
  ink(ctx, '#4a3005', null, 0);
  disc(ctx, -1.7, -50, 1.7, '#ffffff', null, 0);
  ctx.restore();
  // 冠饰：三根尖锐金翎（中高侧低），从天眼上方长出
  for (const [dx, rot, h] of [[-11, -0.55, 20], [0, 0, 27], [11, 0.55, 20]]) {
    part(ctx, dx, -62, rot, 1, (c) => {
      poly(c, [[-4, 5], [0, -h], [4, 5]]);
      ink(c, mix(S.accent, '#ffffff', 0.25), INK.outline, 2.6);
    });
  }
}

function drawWupo(ctx) {
  const S = SERIES_INK.ling;
  groundShadow(ctx, 66, 0.66, 0.42);
  // 漂浮的诅咒微粒（小符环 + 亮点；画在最底层）
  for (const [x, y, r] of [[-60, -30, 5.4], [58, -36, 4.8], [-66, 14, 4.2], [64, 18, 5.0],
                           [-38, -64, 3.8], [42, -68, 4.0], [28, 68, 3.4], [-32, 72, 3.8]]) {
    glow(ctx, x, y, r * 2.4, S.accent, 0.45);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.strokeStyle = mix(S.accent, '#ffffff', 0.25); ctx.lineWidth = 2.4; ctx.stroke();
    disc(ctx, x, y, r * 0.34, mix(S.accent, '#ffffff', 0.4), null, 0);
  }
  // 垂下的符纸 / 幡：让剪影整体"下坠"，与另外五系的横向展开完全不同
  const banner = (x, y, len, rot, w) => {
    part(ctx, x, y, rot, 1, (c) => {
      poly(c, [[-w, 0], [w, 0], [w * 0.8, len], [0, len * 0.93], [-w * 0.8, len]]);
      const g = c.createLinearGradient(0, 0, 0, len);
      g.addColorStop(0, mix(S.main, '#000000', 0.05));
      g.addColorStop(1, mix(S.main, '#000000', 0.5));
      ink(c, g, INK.outline, 2.4);
      // 符痕：一竖 + 三横（朱砂色，用本系强调色不另发明）
      c.strokeStyle = rgba(S.accent, 0.95);
      c.lineWidth = 1.7;
      c.beginPath();
      c.moveTo(0, len * 0.12); c.lineTo(0, len * 0.84);
      for (let i = 1; i <= 3; i++) {
        c.moveTo(-w * 0.55, len * (0.16 + i * 0.2));
        c.lineTo(w * 0.55, len * (0.16 + i * 0.2));
      }
      c.stroke();
    });
  };
  banner(-48, 6, 48, -0.18, 6.5);
  banner(48, 6, 48, 0.18, 6.5);
  banner(-27, 38, 40, -0.07, 6);
  banner(27, 38, 40, 0.07, 6);
  banner(1, 46, 34, 0, 5.5);
  // 矮胖的躯体（"自己挪得慢"）：本体比另两系更扁更宽
  ctx.save();
  ctx.scale(1.04, 0.86);
  baseLarva(ctx, S.main, S.accent, mix(S.main, '#0f3a33', 0.45), 14);
  ctx.restore();
  // 傩面（面具纹样）：压在本体前方，双目是细长竖缝、口是锯齿
  const MY = -18;
  const maskPath = () => {
    poly(ctx, [[-30, MY - 16], [-18, MY - 30], [0, MY - 34], [18, MY - 30], [30, MY - 16],
               [24, MY + 16], [0, MY + 26], [-24, MY + 16]]);
  };
  maskPath();
  const gm = ctx.createLinearGradient(0, MY - 34, 0, MY + 26);
  gm.addColorStop(0, mix(S.accent, '#ffffff', 0.22));
  gm.addColorStop(0.55, mix(S.accent, S.main, 0.5));
  gm.addColorStop(1, mix(S.main, '#000000', 0.3));
  ink(ctx, gm, INK.outline, 3.4);
  for (const s2 of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s2 * 14, MY - 12);
    ctx.quadraticCurveTo(s2 * 21, MY - 1, s2 * 13, MY + 7);
    ctx.quadraticCurveTo(s2 * 8, MY - 1, s2 * 14, MY - 12);
    ctx.closePath();
    ink(ctx, INK.dark, INK.outline, 1.6);
  }
  // 锯齿口
  ctx.beginPath();
  ctx.moveTo(-16, MY + 15);
  for (let i = 0; i < 4; i++) {
    ctx.lineTo(-16 + (i + 0.5) * 8, MY + 22);
    ctx.lineTo(-16 + (i + 1) * 8, MY + 15);
  }
  ctx.strokeStyle = INK.dark; ctx.lineWidth = 2.2; ctx.lineJoin = 'miter'; ctx.stroke();
  // 额头巫纹（额饰）
  ctx.strokeStyle = rgba(INK.dark, 0.9); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, MY - 27); ctx.lineTo(0, MY - 13);
  ctx.moveTo(-7, MY - 22); ctx.lineTo(0, MY - 17); ctx.lineTo(7, MY - 22);
  ctx.stroke();
  // 缠绕的诅咒符环（断续的圈，把本体圈住）
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 4, 74, 62, 0.06, 0, Math.PI * 2);
  ctx.setLineDash([9, 11]);
  ctx.strokeStyle = rgba(S.accent, 0.85);
  ctx.lineWidth = 2.6;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawBusipo(ctx) {
  const S = SERIES_INK.kun;
  groundShadow(ctx, 70, 0.6, 0.4);
  // 玉璧形的厚重盾环：把本体整圈包住（"护盾厚实"）
  const ring = (rx, ry, w) => {
    ctx.beginPath(); ctx.ellipse(0, 2, rx, ry, 0, 0, Math.PI * 2);
    ctx.lineCap = 'butt';
    ctx.strokeStyle = INK.outline; ctx.lineWidth = w + 5; ctx.stroke();
    const g = ctx.createLinearGradient(-rx, -ry, rx, ry);
    g.addColorStop(0, mix(S.accent, '#ffffff', 0.3));
    g.addColorStop(0.42, mix(S.main, '#ffffff', 0.12));
    g.addColorStop(1, mix(S.main, '#000000', 0.52));
    ctx.strokeStyle = g; ctx.lineWidth = w; ctx.stroke();
  };
  ring(60, 57.6, 30);
  // 玉璧的谷纹（环上一圈小方凸）
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + 0.13;
    part(ctx, Math.cos(a) * 60, 2 + Math.sin(a) * 57.6, a + Math.PI / 2, 1, (c) => {
      poly(c, [[-3.4, -3.4], [3.4, -3.4], [3.4, 3.4], [-3.4, 3.4]]);
      ink(c, rgba(S.accent, 0.5), null, 0);
    });
  }
  // 圆钝的本体（比另两系更矮胖、没有一处尖角）
  ctx.save();
  ctx.scale(0.86, 0.82);
  baseLarva(ctx, S.main, S.accent, mix(S.main, '#3b4356', 0.45), 15);
  ctx.restore();
  // 灵芝母题（回复）：短柄 + 肾形芝盖 + 同心生长纹
  const capPath = () => {
    ctx.beginPath();
    ctx.moveTo(-19, -28);
    ctx.quadraticCurveTo(-22, -46, -2, -47);
    ctx.quadraticCurveTo(21, -47, 19, -28);
    ctx.quadraticCurveTo(10, -22, 0, -26);
    ctx.quadraticCurveTo(-10, -22, -19, -28);
    ctx.closePath();
  };
  capsule(ctx, 0, -13, 0, -27, 7, mix(S.main, '#000000', 0.15), INK.outline, 2);
  const capG = ctx.createRadialGradient(-6, -40, 3, 0, -34, 24);
  capG.addColorStop(0, mix(S.accent, '#ffffff', 0.5));
  capG.addColorStop(0.6, mix(S.accent, S.main, 0.45));
  capG.addColorStop(1, mix(S.main, '#000000', 0.18));
  capPath();
  ink(ctx, capG, INK.outline, 3.2);
  ctx.save();
  capPath();
  ctx.clip();
  ctx.strokeStyle = rgba(S.accent, 0.5);
  ctx.lineWidth = 1.6;
  for (let i = 1; i <= 3; i++) {
    ctx.beginPath(); ctx.ellipse(0, -25, 5 * i, 5.5 * i, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
  // 一双平静的小眼（冷白瞳，细长）
  for (const s2 of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(s2 * 10, -6, 6.4, 4.0, 0, 0, Math.PI * 2);
    ink(ctx, INK.dark, INK.outline, 1.8);
    disc(ctx, s2 * 10, -6, 2.4, '#eaf1ff', null, 0);
    disc(ctx, s2 * 10 - s2 * 0.7, -7, 1.0, '#ffffff', null, 0);
  }
  // 盾环前方的两个圆钝护钮（"出手偏钝"：全是圆头，没有尖刺）
  for (const s2 of [-1, 1]) {
    part(ctx, s2 * 58, 30, s2 * 0.3, 1, (c) => {
      disc(c, 0, 0, 12, mix(S.main, '#ffffff', 0.14), INK.outline, 3);
      disc(c, -s2 * 3, -3, 5.4, mix(S.accent, S.main, 0.35), null, 0);
    });
  }
}

// ===========================================================================
// 批 3：51 个道具图标（24 武器 + 24 被动 + 通用被动 / 超武 / 掉落）
// ===========================================================================
// 为什么这批要重画：批 1 的 icon_w_* 全部回退到 generator.js 里同一个四角星、
// 被动全部回退到同一个六边形，于是三选一卡片上 24 把武器长得一模一样。
// 这批给每个槽位画出**可表意、两两可区分**的图标。
//
// 绘制约定（沿用批 1/2 的同一套坐标与笔）：
//   · 仍在 [-100, +100] 坐标系里画，主体外缘控制在 ±(78~98)，
//     经 PAD=0.8 与 ART→24px 的缩放后约 15~19px 见方，四周留 2~4px 透明边；
//   · 24px 太小，所以坚持「一个大剪影 + 1~2 个辨识特征」，
//     不在里面塞细碎纹理：描边统一 7~11 单位（≈0.7~1.1px @24px）；
//   · 配色只取 src/content/series.js 的 color/accent（外加批 1 既有的中性墨色：
//     描边 #140f16、骨白 #e8e2d0、暗窝 #1a1015、金 #f0b357），不发明主色；
//   · 每个图标的「色量配比」也刻意拉开（有的以主色为主、有的以强调色为主、
//     有的掺骨白/暗色），这样既好看，也让颜色直方图这一路的撞脸检查能过。
//
// 形状用小 DSL 描述（见 ICON_SHAPES 的键），画法仍然是矢量 + 4 倍超采样。
// ---------------------------------------------------------------------------
const ICON_INK = { K: '#140f16', B: '#e8e2d0', BD: '#9a9182', W: '#ffffff', D: '#1a1015' };
// 超武图标用「金 + 光」：金色直接取批 1 既有的描边金 INK.rim(#f0b357)，
// 亮金取天问系的 accent(#ffe08a)，两者都在既有流水线里出现过。
const ICON_GOLD = { main: '#f0b357', accent: '#ffe08a' };

function iconPal(series) {
  const S = (series === 'gold') ? ICON_GOLD : SERIES_INK[series];
  return Object.assign({
    M: S.main,
    A: S.accent,
    MH: mix(S.main, '#ffffff', 0.34),
    ML: mix(S.main, '#000000', 0.46),
    AH: mix(S.accent, '#ffffff', 0.38),
    AL: mix(S.accent, '#000000', 0.36),
  }, ICON_INK);
}

// ---- 小工具：把重复母题（羽/尾/芒/石）写成函数，形状本体仍是手摆的 ----
// 锥形刃：从 (x,y) 沿角度 a 伸出 len，根部半宽 w0、尖端半宽 w1，可横向弯 bend
function taper(x, y, a, len, w0, w1, f, s = 'K', lw = 7, bend = 0) {
  const c = Math.cos(a), sn = Math.sin(a), nx = -sn, ny = c;
  const tx = x + c * len + nx * bend, ty = y + sn * len + ny * bend;
  return { k: 'poly', f, s, lw, p: [
    [x + nx * w0, y + ny * w0], [tx + nx * w1, ty + ny * w1],
    [tx - nx * w1, ty - ny * w1], [x - nx * w0, y - ny * w0],
  ] };
}
// 月牙/弧形带：外弧 + 内弧回描，闭合成一条弯带（弓身、月轮、剑气弧都用它）
function crescent(cx, cy, r, thick, a0, a1, steps = 22) {
  const p = [];
  for (let i = 0; i <= steps; i++) { const a = a0 + (a1 - a0) * i / steps; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  for (let i = steps; i >= 0; i--) { const a = a0 + (a1 - a0) * i / steps; p.push([cx + Math.cos(a) * (r - thick), cy + Math.sin(a) * (r - thick)]); }
  return p;
}
function ngon(cx, cy, r, n, rot = -Math.PI / 2, ry = null) {
  const p = [];
  for (let i = 0; i < n; i++) {
    const a = rot + i * Math.PI * 2 / n;
    p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * (ry || r)]);
  }
  return p;
}
// 四角星火花（极光/灵物上的小亮点）
function spark4(x, y, r, f = 'W', s = null, lw = 0) {
  return { k: 'poly', f, s, lw, p: [[x, y - r], [x + r * 0.3, y - r * 0.3], [x + r, y], [x + r * 0.3, y + r * 0.3],
                                    [x, y + r], [x - r * 0.3, y + r * 0.3], [x - r, y], [x - r * 0.3, y - r * 0.3]] };
}

// ---- 形状渲染（ICON_SHAPES 的唯一解释器）----
function paintIcon(ctx, items, P) {
  for (const sh of items) paintIconOne(ctx, sh, P);
}
function icoC(P, key) { return (key === null || key === undefined) ? null : (P[key] || key); }
function paintIconOne(ctx, sh, P) {
  const S0 = 'K', LW = 9;
  switch (sh.k) {
    case 'poly':
      poly(ctx, sh.p);
      ink(ctx, icoC(P, sh.f === undefined ? 'M' : sh.f), icoC(P, sh.s === undefined ? S0 : sh.s), sh.lw === undefined ? LW : sh.lw);
      break;
    case 'grd': {
      poly(ctx, sh.p);
      const ys = sh.p.map(p => p[1]), xs = sh.p.map(p => p[0]);
      const g = ctx.createLinearGradient(0, Math.min.apply(null, ys), 0, Math.max.apply(null, ys));
      g.addColorStop(0, icoC(P, sh.c0 || 'MH'));
      g.addColorStop(1, icoC(P, sh.c1 || 'ML'));
      ink(ctx, g, icoC(P, sh.s === undefined ? S0 : sh.s), sh.lw === undefined ? LW : sh.lw);
      break;
    }
    case 'dsc':
      disc(ctx, sh.x, sh.y, sh.r, icoC(P, sh.f === undefined ? 'M' : sh.f), icoC(P, sh.s === undefined ? S0 : sh.s), sh.lw === undefined ? LW : sh.lw);
      break;
    case 'gdsc': {   // 带径向渐变的圆（宝珠/日轮）
      const g = ctx.createRadialGradient(sh.x - sh.r * 0.3, sh.y - sh.r * 0.34, sh.r * 0.08, sh.x, sh.y, sh.r);
      g.addColorStop(0, icoC(P, sh.c0 || 'AH'));
      g.addColorStop(1, icoC(P, sh.c1 || 'M'));
      disc(ctx, sh.x, sh.y, sh.r, g, icoC(P, sh.s === undefined ? S0 : sh.s), sh.lw === undefined ? LW : sh.lw);
      break;
    }
    case 'ell':
      ctx.beginPath(); ctx.ellipse(sh.x, sh.y, sh.rx, sh.ry, sh.rot || 0, 0, Math.PI * 2);
      ink(ctx, icoC(P, sh.f === undefined ? 'M' : sh.f), icoC(P, sh.s === undefined ? S0 : sh.s), sh.lw === undefined ? LW : sh.lw);
      break;
    case 'cap':
      capsule(ctx, sh.x1, sh.y1, sh.x2, sh.y2, sh.w, icoC(P, sh.f === undefined ? 'M' : sh.f), icoC(P, sh.s === undefined ? S0 : sh.s), sh.lw === undefined ? LW : sh.lw);
      break;
    case 'ring': {   // 整圈环（描边 + 可选虚线）
      ctx.beginPath(); ctx.arc(sh.x, sh.y, sh.r, 0, Math.PI * 2);
      if (sh.dash) ctx.setLineDash(sh.dash);
      if (sh.s) { ctx.strokeStyle = icoC(P, sh.s); ctx.lineWidth = sh.w + (sh.lw || 7) * 2; ctx.stroke(); }
      ctx.strokeStyle = icoC(P, sh.f || 'M'); ctx.lineWidth = sh.w; ctx.stroke();
      ctx.setLineDash([]);
      break;
    }
    case 'arc': {    // 部分圆弧（涡旋/风痕/露滴轨道）
      ctx.beginPath(); ctx.arc(sh.x, sh.y, sh.r, sh.a0, sh.a1);
      ctx.lineCap = 'round';
      if (sh.dash) ctx.setLineDash(sh.dash);
      if (sh.s) { ctx.strokeStyle = icoC(P, sh.s); ctx.lineWidth = sh.w + (sh.lw || 6) * 2; ctx.stroke(); }
      ctx.strokeStyle = icoC(P, sh.f || 'M'); ctx.lineWidth = sh.w; ctx.stroke();
      ctx.setLineDash([]);
      break;
    }
    case 'cur': {    // 平滑折线：close=true 时填充成面，否则描线
      pathThrough(ctx, sh.p, 26);
      if (sh.close) {
        ctx.closePath();
        ink(ctx, icoC(P, sh.f === undefined ? 'M' : sh.f), icoC(P, sh.s === undefined ? S0 : sh.s), sh.lw === undefined ? LW : sh.lw);
      } else {
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        if (sh.s) { ctx.strokeStyle = icoC(P, sh.s); ctx.lineWidth = sh.w + (sh.lw || 6) * 2; ctx.stroke(); }
        ctx.strokeStyle = icoC(P, sh.f || 'M'); ctx.lineWidth = sh.w; ctx.stroke();
      }
      break;
    }
    case 'glo': {
      // 光晕是最外圈的柔光（alpha 由内向外的渐变终止在 0），但它的外缘会一直画到 ±r。
      // 实测：只要光晕越过作画区内缘，Lanczos 缩小到 24px 时的旁瓣就会在最外一行/列
      // 留下 alpha 1~4，于是"四周 ≥1px 全透明"这条会挂（图标比精灵更小时更明显）。
      // 所以这里统一把光晕收在 ±92 之内 —— 光晕本来就只是氛围，不影响造型。
      const lim = 92;
      const r = Math.max(16, Math.min(sh.r, lim - Math.abs(sh.x), lim - Math.abs(sh.y)));
      glow(ctx, sh.x, sh.y, r, icoC(P, sh.c || 'A'), sh.a === undefined ? 0.35 : sh.a);
      break;
    }
    case 'grp':
      ctx.save();
      ctx.translate(sh.x, sh.y);
      if (sh.rot) ctx.rotate(sh.rot);
      if (sh.sc) ctx.scale(sh.sc, sh.sc);
      paintIcon(ctx, sh.items, P);
      ctx.restore();
      break;
    default:
      throw new Error('unknown icon shape kind: ' + sh.k);
  }
}

    { k: 'poly', p: ngon(-64, -64, 11, 4, 0), f: 'AH', s: 'K', lw: 5 },
    { k: 'poly', p: ngon(64, -64, 11, 4, 0), f: 'AH', s: 'K', lw: 5 },
    { k: 'poly', p: ngon(-64, 64, 11, 4, 0), f: 'AH', s: 'K', lw: 5 },
    { k: 'poly', p: ngon(64, 64, 11, 4, 0), f: 'AH', s: 'K', lw: 5 },
  ] },
  // 超武（icon_super）：金环 + 八道光芒 + 中央宝石 + 冠尖 —— 比普通图标更"贵重"
  { id: 'icon_super', cn: '超武图标', series: 'gold', sh: () => {
    const out = [{ k: 'glo', x: 0, y: 0, r: 96, c: 'A', a: 0.5 }];
    for (let i = 0; i < 8; i++) out.push(taper(0, 0, -Math.PI / 2 + i * Math.PI / 4, 84, 11, 3, 'A', 'K', 6));
    out.push({ k: 'ring', x: 0, y: 0, r: 58, w: 17, f: 'M', s: 'K', lw: 9 });
    out.push({ k: 'poly', p: [[0, -40], [25, 0], [0, 40], [-25, 0]], f: 'W', s: 'K', lw: 8 });
    out.push({ k: 'dsc', x: 0, y: 0, r: 9, f: 'M', s: null });
    out.push({ k: 'poly', p: [[-34, -68], [-18, -88], [-4, -64]], f: 'M', s: 'K', lw: 6 });
    out.push({ k: 'poly', p: [[34, -68], [18, -88], [4, -64]], f: 'M', s: 'K', lw: 6 });
    return out;
  } },
  // 掉落物（12×12）：极简发光碎片 —— 12px 下只看得到一个亮核 + 四角尖。
  // 12px 的成品是 200px 缩 16.7 倍，Lanczos 旁瓣在成品上要占 2~3px，所以这里的
  // 内容必须比其他图标再小一圈（±66），否则最外一行/列会被旁瓣抬起而判"贴边"。
  { id: 'icon_drop', cn: '掉落物', series: 'hai', w: 12, h: 12, sh: () => [
    { k: 'glo', x: 0, y: 0, r: 68, c: 'A', a: 0.55 },
    { k: 'poly', p: [[0, -66], [32, 0], [0, 66], [-32, 0]], f: 'A', s: 'K', lw: 10 },
    { k: 'poly', p: [[0, -38], [17, 0], [0, 38], [-17, 0]], f: 'AH', s: null },
    { k: 'dsc', x: 0, y: -12, r: 9, f: 'W', s: null },
  ] },
];

// ---------------------------------------------------------------------------
// 槽位登记表：必须与 src/assets/manifest.js 的 id / w / h 一致
// ---------------------------------------------------------------------------
const ICON_DEFS = ICON_WEAPONS.concat(ICON_PASSIVES, ICON_EXTRA);
// ICON_SCALE：道具图标再统一内缩到 0.90。
// 原因（实测，不是拍脑袋）：24px 的成品是先取 200×200 作画区、再用预乘 alpha 的
// Lanczos 缩到 24，核半径换算到成品上是约 2~3px 的能量扩散。作图若顶到 ±100，
// 内容虽然在 24px 里还有 2.4px 边距，但 Lanczos 的旁瓣会把边缘像素的 alpha 抬到 2~4，
// 于是"四周 ≥1px 全透明"这条就挂了（实测 wuxianfu / shoujia 就是这种 0 边距）。
// 缩到 0.90 后内容半径约 8.5px（成品 17~18px 见方、四周 2~3px 留白），旁瓣落回 0。
const ICON_SCALE = 0.90;
const ICON_SPRITES = ICON_DEFS.map((d) => ({
  id: d.id, cn: d.cn, w: d.w || 24, h: d.h || 24, scale: ICON_SCALE,
  draw: (ctx) => paintIcon(ctx, d.sh(), iconPal(d.series)),
}));

const SPRITES = [
  { id: 'char_shanpo',       cn: '山魄',   w: 32,  h: 32,  draw: drawShanpo },
  { id: 'char_haipo',        cn: '海魄',   w: 32,  h: 32,  draw: drawHaipo },
  { id: 'char_huangpo',      cn: '荒魄',   w: 32,  h: 32,  draw: drawHuangpo },
  { id: 'enemy_shanxiao',    cn: '山魈',   w: 28,  h: 28,  draw: drawShanxiao },
  { id: 'enemy_bifang',      cn: '毕方',   w: 30,  h: 30,  draw: drawBifang },
  { id: 'enemy_huashe',      cn: '化蛇',   w: 28,  h: 28,  draw: drawHuashe },
  { id: 'enemy_xinang',      cn: '傒囊',   w: 26,  h: 26,  draw: drawXinang },
  { id: 'enemy_qiangliang',  cn: '强良',   w: 36,  h: 36,  draw: drawQiangliang },
  { id: 'boss_xiangliu',     cn: '相柳',   w: 132, h: 132, scale: 0.94, draw: drawXiangliu },

  // ---- 批 2：第 4~6 系的玩家角色 ----
  // 追加在数组末尾（批 1 的 9 个槽位索引不变 → 那 9 张图切片结果不变）。
  // 12 个槽位 = 3 列 × 4 行 → 网格图 768×1024，build.ps1 会自动按这个尺寸开窗口。
  { id: 'char_tianpo',       cn: '天魄',   w: 32,  h: 32,  draw: drawTianpo },
  { id: 'char_wupo',         cn: '巫魄',   w: 32,  h: 32,  draw: drawWupo },
  { id: 'char_busipo',       cn: '不死魄', w: 32,  h: 32,  draw: drawBusipo },

  // ---- 批 3：51 个道具图标（24 武器 + 24 被动 + 通用被动 / 超武 / 掉落）----
  // 同样追加在数组末尾：批 1/2 的 12 个槽位索引不变 → 那 12 张图切片结果不变。
  // 51 + 12 = 63 个槽位 = 3 列 × 21 行 → 网格图 768×5376（build.ps1 自动算窗口尺寸）。
  ...ICON_SPRITES,
];

// 网格参数（slice.py 里必须用同样的值）
const CELL = 256;   // 单元格边长
const ART = 200;    // 单元格内居中的作画正方形边长（4 倍超采样区）
const COLS = 3;
// PAD：在每个单元格内把画稿整体缩一圈。绘制函数按 ±100 设计，这里统一缩到 ±80，
// 于是"至少 1px 透明边距"是构造出来的（不会被游戏裁掉）。改大 PAD 会更保守（精灵变小）。
const PAD = 0.80;

function renderSheet() {
  const rows = Math.ceil(SPRITES.length / COLS);
  const cv = document.getElementById('sheet');
  cv.width = COLS * CELL;
  cv.height = rows * CELL;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  SPRITES.forEach((sp, i) => {
    const col = i % COLS, row = Math.floor(i / COLS);
    const cellX = col * CELL, cellY = row * CELL;
    ctx.save();
    // 网格辅助线（很淡，仅便于人眼审图；切片时不会被取到，因为远离中心）
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1;
    ctx.strokeRect(cellX + 0.5, cellY + 0.5, CELL - 1, CELL - 1);
    // 作画区：居中的 ART×ART 正方形，原点移到中心
    ctx.translate(cellX + CELL / 2, cellY + CELL / 2);
    // 角落标签（审图用；slice.py 按 ART 正方形取图，不会带进成品）
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '13px monospace';
    ctx.textBaseline = 'top';
    ctx.fillText(`${sp.id}  ${sp.cn}  ${sp.w}x${sp.h}`, -CELL / 2 + 8, CELL / 2 - 22);
    // 轻微裁剪保护：即使画超了也不会污染相邻单元格
    ctx.save();
    ctx.scale(PAD * (sp.scale || 1), PAD * (sp.scale || 1));   // 统一内缩，保证四周留白
    const lim = ART / 2 / (PAD * (sp.scale || 1));
    ctx.beginPath();
    ctx.rect(-lim, -lim, lim * 2, lim * 2);
    ctx.clip();
    sp.draw(ctx);
    ctx.restore();
    ctx.restore();
  });

  // 供 slice.py / 人工核对
  window.__SPRITE_SHEET__ = { cell: CELL, art: ART, cols: COLS, sprites: SPRITES.map(s => ({ id: s.id, cn: s.cn, w: s.w, h: s.h })) };
  document.title = 'ready:' + SPRITES.length;
}
renderSheet();
</script>
</body>
</html>
